<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1800">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
    <meta name="theme-color" content="#242122">
    <meta name="description" content="Bishop Moore Catholic High School bell schedules and school calendar.">

    <!-- MooreKit and page styles. -->
    <link rel="stylesheet" type="text/css" href="styles/bmc-v3.min.css">

    <!-- Full-screen schedule layout. -->
    <link rel="stylesheet" type="text/css" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <title>Bell Schedule | Bishop Moore Catholic</title>
</head>

<!-- MooreKit namespace. -->
<body class="bmc-v3">
    <!-- Keyboard shortcut to the schedule. -->
    <a class="skip-link" href="#schedule">Skip to schedule</a>

    <!-- Full-screen utility shell. -->
    <div class="schedule-app">
        <!-- Compact header; script.js updates #time. -->
        <header class="utility-header bmc-section-dark">
            <div class="utility-brand">
                <span class="bmc-eyebrow">Bishop Moore Catholic</span>
                <h1>Bell Schedule</h1>
            </div>
            <div id="time" class="utility-clock" aria-label="Current date and time"></div>
        </header>

        <!-- Button IDs match schedule data keys in script.js. -->
        <nav class="schedule-nav" aria-label="Available bell schedules">
            <div class="schedule-nav-scroll">
                <!-- Insert active schedule buttons below this line. -->
                <button type="button" onclick="navClick('btn-MF')" id="btn-MF" class="bmc-btn bmc-btn-sm bmc-btn-outline active">M / T / Th / F</button>
                <button type="button" onclick="navClick('btn-Wed')" id="btn-Wed" class="bmc-btn bmc-btn-sm bmc-btn-outline">Wednesday</button>
                <!-- <button type="button" onclick="navClick('btn-classMass')" id="btn-classMass" class="bmc-btn bmc-btn-sm bmc-btn-outline">Class Mass</button> -->
                <button type="button" onclick="navClick('btn-allMass')" id="btn-allMass" class="bmc-btn bmc-btn-sm bmc-btn-outline">All School Mass</button>
                <button type="button" onclick="navClick('btn-allMassWed')" id="btn-allMassWed" class="bmc-btn bmc-btn-sm bmc-btn-outline">Mass (Wed)</button>
                <button type="button" onclick="navClick('btn-bless')" id="btn-bless" class="bmc-btn bmc-btn-sm bmc-btn-outline">Blessing</button>
                <!-- <button type="button" onclick="navClick('btn-blessWed')" id="btn-blessWed" class="bmc-btn bmc-btn-sm bmc-btn-outline">Blessing (Wed)</button> -->
                <button type="button" onclick="navClick('btn-noon')" id="btn-noon" class="bmc-btn bmc-btn-sm bmc-btn-outline">Noon Dismissal</button>
                <!-- <button type="button" onclick="navClick('btn-pep')" id="btn-pep" class="bmc-btn bmc-btn-sm bmc-btn-outline">Pep Rally</button> -->
                <!-- <button type="button" onclick="navClick('btn-custom1')" id="btn-custom1" class="bmc-btn bmc-btn-sm bmc-btn-outline">5 / 20 / 2026</button> -->
                <!-- <button type="button" onclick="navClick('btn-assembly')" id="btn-assembly" class="bmc-btn bmc-btn-sm bmc-btn-outline">Assembly</button> -->
                <button type="button" onclick="navClick('btn-Exams')" id="btn-Exams" class="bmc-btn bmc-btn-sm bmc-btn-outline">Exams</button>
                <button type="button" onclick="navClick('btn-Cal')" id="btn-Cal" class="bmc-btn bmc-btn-sm bmc-btn-dark">Calendar</button>
                <!-- Insert active schedule buttons above this line. -->
            </div>
        </nav>

        <!-- Selected schedule output. -->
        <main id="schedule" class="schedule-display"></main>
    </div>

    <!-- Schedule data, rendering, and highlighting. -->
    <script src="scripts/script.js"></script>
</body>
</html>
